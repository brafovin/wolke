<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Abenteuer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 18px;
      pointer-events: none;
    }
    #title {
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    #score {
      color: #ffd700;
      font-family: 'Segoe UI', sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    #controls-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.75);
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      pointer-events: none;
      white-space: nowrap;
      background: rgba(0,0,0,0.3);
      padding: 5px 14px;
      border-radius: 20px;
    }
    #fallen-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b6b;
      font-family: 'Segoe UI', sans-serif;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 20px #ff0000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="title">🏃 3D Abenteuer</div>
  <div id="score">⭐ 0 / 10</div>
</div>
<div id="controls-hint">
  W/S: Vor/Zurück &nbsp;|&nbsp; A/D: Drehen &nbsp;|&nbsp; Leertaste: Springen &nbsp;|&nbsp; Maus ziehen: Kamera
</div>
<div id="fallen-msg">Heruntergefallen! 💀</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene ─────────────────────────────────────────────────────────────────────

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x87ceeb, 0.022);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 6, 10);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Lighting ──────────────────────────────────────────────────────────────────

scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const sun = new THREE.DirectionalLight(0xfff5d0, 1.3);
sun.position.set(18, 30, 12);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 100;
sun.shadow.camera.left = sun.shadow.camera.bottom = -35;
sun.shadow.camera.right = sun.shadow.camera.top = 35;
scene.add(sun);

// Sun sphere (visual only)
const sunSphere = new THREE.Mesh(
  new THREE.SphereGeometry(2.5, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xfff176 })
);
sunSphere.position.set(40, 50, -30);
scene.add(sunSphere);

// ── Ground ────────────────────────────────────────────────────────────────────

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshLambertMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(100, 50, 0x388e3c, 0x388e3c);
grid.position.y = 0.01;
scene.add(grid);

// ── Platforms ─────────────────────────────────────────────────────────────────

const platColors = [0x8d6e63, 0x7986cb, 0xe57373, 0x81c784, 0xffb74d];
const platforms = [];

function addPlatform(cx, baseY, cz, w, d, h, colorIdx) {
  const mat = new THREE.MeshLambertMaterial({ color: platColors[colorIdx % platColors.length] });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(cx, baseY + h / 2, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  platforms.push({ cx, cz, top: baseY + h, halfW: w / 2, halfD: d / 2 });
}

addPlatform( 6,  0.6, -5,  4, 4, 1.2, 0);
addPlatform(11,  1.4, -9,  3, 3, 1.0, 1);
addPlatform(16,  2.4, -6,  4, 4, 1.2, 2);
addPlatform( 2,  1.0,-12,  3, 3, 1.0, 3);
addPlatform(-5,  0.6, -8,  4, 4, 1.2, 4);
addPlatform(-10, 1.6, -4,  3, 3, 1.0, 0);
addPlatform(-14, 2.6, -9,  4, 4, 1.2, 1);
addPlatform( 0,  3.2,-18,  6, 6, 1.4, 2);
addPlatform( 8,  4.0,-22,  3, 3, 1.0, 3);

// ── Trees ─────────────────────────────────────────────────────────────────────

function addTree(x, z, scale) {
  const s = scale || 1;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18 * s, 0.28 * s, 2.2 * s, 7),
    new THREE.MeshLambertMaterial({ color: 0x6d4c41 })
  );
  trunk.position.set(x, 1.1 * s, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(1.2 * s, 3.0 * s, 7),
    new THREE.MeshLambertMaterial({ color: 0x2e7d32 })
  );
  crown.position.set(x, 3.8 * s, z);
  crown.castShadow = true;
  scene.add(crown);
}

[
  [-8,-16,1.1],[14,-14,1.3],[-17,-7,0.9],[9,9,1.2],
  [-12,11,1.0],[3,15,1.4],[22,2,1.2],[-22,7,0.8],
  [6,18,1.1],[-7,17,1.3],[18,-20,0.9],[-18,-18,1.1]
].forEach(([x,z,s]) => addTree(x, z, s));

// ── Coins (stars) ─────────────────────────────────────────────────────────────

const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700, emissive: 0x886600 });
const coins = [];

const coinSpots = [
  [3, 0.8, -2],   [7, 1.5, -5],   [11, 3.0, -9],  [16, 4.2, -6],
  [-4, 0.8, -5],  [-10, 2.4, -4], [-14, 4.4, -9],  [0, 5.2, -18],
  [2, 1.8, -12],  [8, 5.6, -22],
];

coinSpots.forEach(([x, y, z]) => {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.09, 10, 18), coinMat);
  mesh.rotation.x = Math.PI / 2;
  mesh.position.set(x, y + 0.7, z);
  mesh.castShadow = true;
  scene.add(mesh);
  coins.push({ mesh, collected: false, baseY: y + 0.7 });
});

const scoreEl = document.getElementById('score');
const fallenEl = document.getElementById('fallen-msg');
let coinCount = 0;

// ── Player ────────────────────────────────────────────────────────────────────

const playerGroup = new THREE.Group();
scene.add(playerGroup);

// Body
const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.55, 0.72, 0.38),
  new THREE.MeshLambertMaterial({ color: 0x3a6fff })
);
body.position.y = 0.86;
body.castShadow = true;
playerGroup.add(body);

// Head
const head = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.48, 0.48),
  new THREE.MeshLambertMaterial({ color: 0xffcc80 })
);
head.position.y = 1.42;
head.castShadow = true;
playerGroup.add(head);

// Eyes
const eyeMat = new THREE.MeshLambertMaterial({ color: 0x111122 });
[-0.11, 0.11].forEach(xOff => {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.065, 7, 7), eyeMat);
  eye.position.set(xOff, 1.46, 0.24);
  playerGroup.add(eye);
});

// Legs
const legMat = new THREE.MeshLambertMaterial({ color: 0x1a237e });
const legs = [];
[-0.145, 0.145].forEach(xOff => {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.52, 0.21), legMat);
  leg.position.set(xOff, 0.26, 0);
  leg.castShadow = true;
  playerGroup.add(leg);
  legs.push(leg);
});

// Arms
const armMat = new THREE.MeshLambertMaterial({ color: 0x2255dd });
const arms = [];
[-0.39, 0.39].forEach(xOff => {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.52, 0.19), armMat);
  arm.position.set(xOff, 0.88, 0);
  arm.castShadow = true;
  playerGroup.add(arm);
  arms.push(arm);
});

// ── Player State ──────────────────────────────────────────────────────────────

const player = {
  pos:      new THREE.Vector3(0, 0, 3),
  vel:      new THREE.Vector3(0, 0, 0),
  yaw:      0,
  onGround: true,
};

// ── Camera State ──────────────────────────────────────────────────────────────

let camYaw   = 0;
let camPitch = 0.38;
const CAM_DIST = 7;

// ── Input ─────────────────────────────────────────────────────────────────────

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Mouse look
let mouseDragging = false, lastMx = 0, lastMy = 0;
renderer.domElement.addEventListener('mousedown', e => {
  mouseDragging = true; lastMx = e.clientX; lastMy = e.clientY;
});
document.addEventListener('mouseup', () => mouseDragging = false);
document.addEventListener('mousemove', e => {
  if (!mouseDragging) return;
  camYaw   -= (e.clientX - lastMx) * 0.004;
  camPitch  = Math.max(0.08, Math.min(1.3, camPitch - (e.clientY - lastMy) * 0.004));
  lastMx = e.clientX; lastMy = e.clientY;
});

// Touch
let touchLast = null;
window.addEventListener('touchstart', e => {
  touchLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!touchLast) return;
  const dx = e.touches[0].clientX - touchLast.x;
  const dy = e.touches[0].clientY - touchLast.y;
  camYaw   -= dx * 0.006;
  camPitch  = Math.max(0.08, Math.min(1.3, camPitch - dy * 0.006));
  touchLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

// ── Physics constants ─────────────────────────────────────────────────────────

const GRAVITY    = -22;
const JUMP_VEL   = 9.5;
const MOVE_SPEED = 5.8;
const TURN_SPEED = 2.2;

let legAnim = 0;
let fallenTimer = 0;

function getGroundY(px, py, pz) {
  let gy = 0;
  for (const p of platforms) {
    if (px > p.cx - p.halfW - 0.28 && px < p.cx + p.halfW + 0.28 &&
        pz > p.cz - p.halfD - 0.28 && pz < p.cz + p.halfD + 0.28 &&
        py >= p.top - 0.45) {
      gy = Math.max(gy, p.top);
    }
  }
  return gy;
}

// ── Update ────────────────────────────────────────────────────────────────────

function update(dt) {
  const ps = player;

  // Turning
  const turnAmt = TURN_SPEED * dt;
  if (keys['KeyA'] || keys['ArrowLeft'])  { ps.yaw += turnAmt; camYaw += turnAmt; }
  if (keys['KeyD'] || keys['ArrowRight']) { ps.yaw -= turnAmt; camYaw -= turnAmt; }

  // Movement direction (player facing)
  const fwdX = -Math.sin(ps.yaw);
  const fwdZ = -Math.cos(ps.yaw);
  let moving = false;

  if (keys['KeyW'] || keys['ArrowUp']) {
    ps.vel.x = fwdX * MOVE_SPEED;
    ps.vel.z = fwdZ * MOVE_SPEED;
    moving = true;
  } else if (keys['KeyS'] || keys['ArrowDown']) {
    ps.vel.x = -fwdX * MOVE_SPEED;
    ps.vel.z = -fwdZ * MOVE_SPEED;
    moving = true;
  } else {
    ps.vel.x *= 0.75;
    ps.vel.z *= 0.75;
    if (Math.abs(ps.vel.x) < 0.02) ps.vel.x = 0;
    if (Math.abs(ps.vel.z) < 0.02) ps.vel.z = 0;
    moving = Math.abs(ps.vel.x) + Math.abs(ps.vel.z) > 0.1;
  }

  // Jump
  if (keys['Space'] && ps.onGround) {
    ps.vel.y = JUMP_VEL;
    ps.onGround = false;
  }

  // Gravity
  if (!ps.onGround) ps.vel.y += GRAVITY * dt;
  ps.vel.y = Math.max(ps.vel.y, -18);

  // Integrate
  ps.pos.x += ps.vel.x * dt;
  ps.pos.y += ps.vel.y * dt;
  ps.pos.z += ps.vel.z * dt;

  // Ground / platform collision
  const gy = getGroundY(ps.pos.x, ps.pos.y, ps.pos.z);
  if (ps.pos.y <= gy) {
    ps.pos.y = gy;
    ps.vel.y = 0;
    ps.onGround = true;
  } else {
    ps.onGround = false;
  }

  // World boundary
  ps.pos.x = Math.max(-45, Math.min(45, ps.pos.x));
  ps.pos.z = Math.max(-45, Math.min(45, ps.pos.z));

  // Fall off world → respawn
  if (ps.pos.y < -6) {
    ps.pos.set(0, 0, 3);
    ps.vel.set(0, 0, 0);
    ps.onGround = true;
    fallenTimer = 2.0;
  }

  // "Fallen" message
  if (fallenTimer > 0) {
    fallenTimer -= dt;
    fallenEl.style.opacity = Math.min(1, fallenTimer * 3);
  } else {
    fallenEl.style.opacity = 0;
  }

  // Update mesh
  playerGroup.position.copy(ps.pos);
  playerGroup.rotation.y = ps.yaw;

  // Leg/arm animation
  const inAir = !ps.onGround;
  if (moving && ps.onGround) legAnim += dt * 9;
  const swing = Math.sin(legAnim) * (moving ? 0.55 : 0);
  legs[0].rotation.x =  swing;
  legs[1].rotation.x = -swing;
  arms[0].rotation.x = -swing * 0.6;
  arms[1].rotation.x =  swing * 0.6;

  // Squash/stretch on jump
  const jumpStretch = inAir ? 1.15 : (ps.onGround && ps.vel.y === 0 ? 1.0 : 1.0);
  playerGroup.scale.y = jumpStretch;

  // Coin animation + collection
  coins.forEach((c, i) => {
    if (c.collected) return;
    c.mesh.rotation.y += dt * 2.2;
    c.mesh.position.y = c.baseY + Math.sin(Date.now() / 800 + i * 1.3) * 0.12;

    const dx = ps.pos.x - c.mesh.position.x;
    const dy = ps.pos.y + 0.8 - c.mesh.position.y;
    const dz = ps.pos.z - c.mesh.position.z;
    if (dx * dx + dy * dy + dz * dz < 1.1) {
      c.collected = true;
      scene.remove(c.mesh);
      coinCount++;
      scoreEl.textContent = coinCount === coins.length
        ? `🎉 Alle Sterne gesammelt!`
        : `⭐ ${coinCount} / ${coins.length}`;
    }
  });

  // Camera follow (smooth lerp)
  const tx = ps.pos.x + Math.sin(camYaw) * Math.cos(camPitch) * CAM_DIST;
  const ty = ps.pos.y + 1.5 + Math.sin(camPitch) * CAM_DIST;
  const tz = ps.pos.z + Math.cos(camYaw) * Math.cos(camPitch) * CAM_DIST;
  const lerpSpeed = 0.12;
  camera.position.x += (tx - camera.position.x) * lerpSpeed;
  camera.position.y += (ty - camera.position.y) * lerpSpeed;
  camera.position.z += (tz - camera.position.z) * lerpSpeed;
  camera.lookAt(ps.pos.x, ps.pos.y + 1, ps.pos.z);
}

// ── Render loop ───────────────────────────────────────────────────────────────

let prevTime = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - prevTime) / 1000, 0.05);
  prevTime = t;
  if (dt > 0) update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(t => { prevTime = t; requestAnimationFrame(loop); });
</script>
</body>
</html>
