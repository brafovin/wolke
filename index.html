<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ausweich-Spiel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    #hud {
      display: flex;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    #hud span { color: #aef; }

    #canvas {
      border: 2px solid #334;
      border-radius: 8px;
      background: #0d0d2b;
      display: block;
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    #overlay h1 { font-size: 48px; color: #7af; letter-spacing: 2px; }
    #overlay p  { font-size: 16px; color: #aac; max-width: 340px; line-height: 1.6; }

    #overlay button {
      padding: 14px 40px;
      font-size: 20px;
      background: #3a6fff;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #overlay button:hover { background: #5a8fff; }

    #overlay .score-display {
      font-size: 28px;
      color: #fa0;
    }

    .controls-hint {
      font-size: 13px;
      color: #556;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div id="hud">
  <div>Punkte: <span id="score">0</span></div>
  <div>Level: <span id="level">1</span></div>
  <div>Leben: <span id="lives">❤️❤️❤️</span></div>
</div>

<canvas id="canvas" width="480" height="600"></canvas>

<div id="overlay">
  <h1>⚡ AUSWEICHEN ⚡</h1>
  <p>Bewege den Charakter mit <strong>← →</strong> oder <strong>A D</strong>.<br>
     Weiche den fallenden Objekten aus so lange wie möglich!</p>
  <div class="controls-hint">Auf Mobilgeräten: Tippe links/rechts auf den Bildschirm</div>
  <button id="startBtn">Spielen</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const overlay    = document.getElementById('overlay');
const startBtn   = document.getElementById('startBtn');
const scoreEl    = document.getElementById('score');
const levelEl    = document.getElementById('level');
const livesEl    = document.getElementById('lives');

const W = canvas.width;
const H = canvas.height;

// ── State ────────────────────────────────────────────────────────────────────

let player, objects, score, lives, level, speed, spawnTimer, spawnInterval;
let running = false;
let keys = {};
let raf;
let invincible = 0;   // frames of invincibility after a hit
let lastTime = 0;

// ── Player ───────────────────────────────────────────────────────────────────

function makePlayer() {
  return {
    x: W / 2,
    y: H - 60,
    w: 32,
    h: 48,
    vx: 0,
    speed: 5,
  };
}

// ── Falling objects ───────────────────────────────────────────────────────────

const SHAPES = ['⬛', '🔴', '💣', '⭐', '🪨'];

function spawnObject() {
  const size = 24 + Math.random() * 20;
  return {
    x: size / 2 + Math.random() * (W - size),
    y: -size,
    w: size,
    h: size,
    vy: speed * (0.7 + Math.random() * 0.6),
    emoji: SHAPES[Math.floor(Math.random() * SHAPES.length)],
  };
}

// ── Init / reset ──────────────────────────────────────────────────────────────

function reset() {
  player        = makePlayer();
  objects       = [];
  score         = 0;
  lives         = 3;
  level         = 1;
  speed         = 2.8;
  spawnTimer    = 0;
  spawnInterval = 90;   // frames
  invincible    = 0;
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  livesEl.textContent = '❤️'.repeat(lives);
}

// ── Drawing ───────────────────────────────────────────────────────────────────

function drawPlayer(p) {
  if (invincible > 0 && Math.floor(invincible / 5) % 2 === 0) return; // blink

  ctx.save();

  // Body
  ctx.fillStyle = '#3a6fff';
  ctx.beginPath();
  ctx.roundRect(p.x - p.w / 2, p.y - p.h / 2 + 14, p.w, p.h - 14, 6);
  ctx.fill();

  // Head
  ctx.fillStyle = '#f9c784';
  ctx.beginPath();
  ctx.arc(p.x, p.y - p.h / 2 + 10, 12, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(p.x - 4, p.y - p.h / 2 + 8, 2, 0, Math.PI * 2);
  ctx.arc(p.x + 4, p.y - p.h / 2 + 8, 2, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.strokeStyle = '#3a6fff';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(p.x - 7, p.y + p.h / 2 - 16);
  ctx.lineTo(p.x - 9, p.y + p.h / 2);
  ctx.moveTo(p.x + 7, p.y + p.h / 2 - 16);
  ctx.lineTo(p.x + 9, p.y + p.h / 2);
  ctx.stroke();

  // Arms
  ctx.strokeStyle = '#3a6fff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(p.x - p.w / 2, p.y - p.h / 2 + 22);
  ctx.lineTo(p.x - p.w / 2 - 10, p.y - p.h / 2 + 34);
  ctx.moveTo(p.x + p.w / 2, p.y - p.h / 2 + 22);
  ctx.lineTo(p.x + p.w / 2 + 10, p.y - p.h / 2 + 34);
  ctx.stroke();

  ctx.restore();
}

function drawObject(o) {
  ctx.font = `${o.w}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(o.emoji, o.x, o.y);
}

function drawBackground() {
  ctx.fillStyle = '#0d0d2b';
  ctx.fillRect(0, 0, W, H);

  // ground line
  ctx.strokeStyle = '#223';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - 20);
  ctx.lineTo(W, H - 20);
  ctx.stroke();
}

// ── Collision ─────────────────────────────────────────────────────────────────

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw / 2 < bx + bw / 2
      && ax + aw / 2 > bx - bw / 2
      && ay - ah / 2 < by + bh / 2
      && ay + ah / 2 > by - bh / 2;
}

// ── Game loop ─────────────────────────────────────────────────────────────────

function update() {
  // Player movement
  let dx = 0;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += player.speed;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x + dx));

  // Spawn objects
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    objects.push(spawnObject());
    spawnTimer = 0;
  }

  // Move objects
  for (let i = objects.length - 1; i >= 0; i--) {
    objects[i].y += objects[i].vy;
    if (objects[i].y - objects[i].h / 2 > H) {
      objects.splice(i, 1);
      score++;
      updateHUD();
    }
  }

  // Collision
  if (invincible > 0) {
    invincible--;
  } else {
    for (let o of objects) {
      if (rectsOverlap(player.x, player.y, player.w * 0.7, player.h * 0.7,
                       o.x, o.y, o.w * 0.8, o.h * 0.8)) {
        lives--;
        invincible = 90;
        updateHUD();
        if (lives <= 0) { gameOver(); return; }
        break;
      }
    }
  }

  // Difficulty ramp
  const newLevel = 1 + Math.floor(score / 10);
  if (newLevel !== level) {
    level = newLevel;
    speed = 2.8 + (level - 1) * 0.5;
    spawnInterval = Math.max(35, 90 - (level - 1) * 8);
    updateHUD();
  }
}

function draw() {
  drawBackground();
  objects.forEach(drawObject);
  drawPlayer(player);

  // Score counter on canvas
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.font = 'bold 80px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(score, W / 2, H / 2);
}

function loop(ts) {
  if (!running) return;
  update();
  draw();
  raf = requestAnimationFrame(loop);
}

// ── Game over / start ─────────────────────────────────────────────────────────

function gameOver() {
  running = false;
  cancelAnimationFrame(raf);

  overlay.innerHTML = `
    <h1>💀 Game Over</h1>
    <div class="score-display">Punkte: ${score}</div>
    <p>Level ${level} erreicht!<br>Kannst du mehr Objekte ausweichen?</p>
    <button id="startBtn">Nochmal spielen</button>
  `;
  overlay.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', startGame);
}

function startGame() {
  overlay.style.display = 'none';
  reset();
  running = true;
  raf = requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.key] = false; });

// Touch controls
let touchStartX = null;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (touchStartX === null || !running) return;
  const dx = e.touches[0].clientX - touchStartX;
  if (Math.abs(dx) > 5) {
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x + dx * 0.4));
    touchStartX = e.touches[0].clientX;
  }
}, { passive: true });

// ── Boot ──────────────────────────────────────────────────────────────────────

startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
