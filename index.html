<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ausweich & Sammel Spiel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    #hud {
      display: flex;
      gap: 28px;
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: bold;
    }
    #hud span { color: #aef; }
    #collected-hud { color: #ffd700; }

    #canvas {
      border: 2px solid #334;
      border-radius: 8px;
      background: #0d0d2b;
      display: block;
    }

    /* ── Overlays ── */
    .screen {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 20px;
    }
    .screen.active { display: flex; }

    .screen h1 { font-size: 42px; color: #7af; letter-spacing: 2px; }
    .screen h2 { font-size: 24px; color: #cde; margin-bottom: 4px; }
    .screen p  { font-size: 14px; color: #99b; max-width: 360px; line-height: 1.6; }

    .btn {
      padding: 12px 36px;
      font-size: 18px;
      background: #3a6fff;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover  { background: #5a8fff; }
    .btn:active { transform: scale(0.96); }

    .score-display { font-size: 26px; color: #fa0; }

    /* ── Character picker ── */
    .char-section { width: 100%; max-width: 400px; }
    .char-section h3 { font-size: 14px; color: #88a; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

    .char-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .char-card {
      font-size: 36px;
      width: 62px;
      height: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 2px solid #334;
      background: #11152a;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, background 0.15s;
      position: relative;
    }
    .char-card span.label {
      font-size: 9px;
      color: #778;
      margin-top: 2px;
      line-height: 1;
    }
    .char-card:hover  { border-color: #558; background: #1a1f3a; transform: scale(1.06); }
    .char-card.selected {
      border-color: #3a6fff;
      background: #1a2a5a;
      box-shadow: 0 0 10px #3a6fff88;
    }
  </style>
</head>
<body>

<div id="hud">
  <div>Punkte: <span id="score">0</span></div>
  <div>Level: <span id="level">1</span></div>
  <div>Leben: <span id="lives">❤️❤️❤️</span></div>
  <div id="collected-hud">⭐ <span id="collected">0</span></div>
</div>

<canvas id="canvas" width="480" height="580"></canvas>

<!-- START SCREEN -->
<div id="screen-start" class="screen active">
  <h1>⚡ AUSWEICHEN ⚡</h1>
  <p>Weiche den Gefahren aus 💣🪨🔥<br>
     und sammel die Bonusobjekte ein ⭐💎🍀</p>
  <button class="btn" id="btn-to-char">Charakter wählen →</button>
</div>

<!-- CHARACTER SELECT SCREEN -->
<div id="screen-char" class="screen">
  <h2>Wähle deinen Charakter</h2>

  <div class="char-section">
    <h3>👨 Menschen</h3>
    <div class="char-grid" id="grid-humans"></div>
  </div>

  <div class="char-section">
    <h3>🐾 Tiere</h3>
    <div class="char-grid" id="grid-animals"></div>
  </div>

  <button class="btn" id="btn-start">Spielen ▶</button>
</div>

<!-- GAME OVER SCREEN -->
<div id="screen-gameover" class="screen">
  <h1>💀 Game Over</h1>
  <div class="score-display" id="final-score"></div>
  <p id="final-msg"></p>
  <button class="btn" id="btn-replay">Nochmal spielen</button>
  <button class="btn" id="btn-charselect" style="background:#334; font-size:14px; padding:8px 20px;">Charakter wechseln</button>
</div>

<script>
// ── Characters ────────────────────────────────────────────────────────────────

const HUMANS = [
  { emoji: '👨', label: 'Mann',         bodyColor: '#3a6fff' },
  { emoji: '👩', label: 'Frau',         bodyColor: '#e040fb' },
  { emoji: '👦', label: 'Junge',        bodyColor: '#00bcd4' },
  { emoji: '👧', label: 'Mädchen',      bodyColor: '#f06292' },
  { emoji: '🧙', label: 'Zauberer',     bodyColor: '#7c4dff' },
  { emoji: '🦸', label: 'Held',         bodyColor: '#e53935' },
  { emoji: '🧜', label: 'Nixe',         bodyColor: '#00897b' },
  { emoji: '🤴', label: 'Prinz',        bodyColor: '#ffc107' },
];

const ANIMALS = [
  { emoji: '🐱', label: 'Katze',   bodyColor: '#ff8a65' },
  { emoji: '🐶', label: 'Hund',    bodyColor: '#8d6e63' },
  { emoji: '🐸', label: 'Frosch',  bodyColor: '#43a047' },
  { emoji: '🐰', label: 'Hase',    bodyColor: '#f8bbd0' },
  { emoji: '🦊', label: 'Fuchs',   bodyColor: '#ef6c00' },
  { emoji: '🐼', label: 'Panda',   bodyColor: '#546e7a' },
  { emoji: '🐯', label: 'Tiger',   bodyColor: '#f9a825' },
  { emoji: '🦄', label: 'Einhorn', bodyColor: '#ce93d8' },
];

// ── Canvas / DOM ──────────────────────────────────────────────────────────────

const canvas      = document.getElementById('canvas');
const ctx         = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const screens = {
  start:    document.getElementById('screen-start'),
  char:     document.getElementById('screen-char'),
  gameover: document.getElementById('screen-gameover'),
};

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  if (name) screens[name].classList.add('active');
}

// ── State ─────────────────────────────────────────────────────────────────────

let player, hazards, collectibles, score, collectedCount, lives, level;
let speed, hazardTimer, hazardInterval, collectTimer, collectInterval;
let running = false, keys = {}, raf, invincible = 0;
let selectedChar = HUMANS[0];
let popups = [];   // floating "+X" text effects

// ── Build character grids ─────────────────────────────────────────────────────

function buildGrid(containerId, list) {
  const grid = document.getElementById(containerId);
  list.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.dataset.idx = i;
    card.dataset.group = containerId;
    card.innerHTML = `${ch.emoji}<span class="label">${ch.label}</span>`;
    card.addEventListener('click', () => selectChar(ch, card));
    grid.appendChild(card);
  });
}

buildGrid('grid-humans',  HUMANS);
buildGrid('grid-animals', ANIMALS);

// pre-select first
document.querySelector('#grid-humans .char-card').classList.add('selected');

function selectChar(ch, card) {
  document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedChar = ch;
}

// ── Player ────────────────────────────────────────────────────────────────────

function makePlayer() {
  return { x: W / 2, y: H - 70, w: 56, h: 80, speed: 5.5, legAnim: 0 };
}

// ── Falling objects ───────────────────────────────────────────────────────────

const HAZARD_EMOJIS    = ['💣', '🪨', '🔥', '❌', '☄️'];
const COLLECT_EMOJIS   = ['⭐', '💎', '🍀', '🪙', '🍎', '💰'];
const COLLECT_POINTS   = { '⭐': 3, '💎': 5, '🍀': 4, '🪙': 2, '🍎': 2, '💰': 6 };

function spawnHazard() {
  const size = 26 + Math.random() * 18;
  return {
    x:     size / 2 + Math.random() * (W - size),
    y:     -size,
    w:     size,
    h:     size,
    vy:    speed * (0.75 + Math.random() * 0.55),
    emoji: HAZARD_EMOJIS[Math.floor(Math.random() * HAZARD_EMOJIS.length)],
    type:  'hazard',
  };
}

function spawnCollectible() {
  const size = 28;
  const emoji = COLLECT_EMOJIS[Math.floor(Math.random() * COLLECT_EMOJIS.length)];
  return {
    x:     size / 2 + Math.random() * (W - size),
    y:     -size,
    w:     size,
    h:     size,
    vy:    (speed * 0.55) * (0.8 + Math.random() * 0.4),
    emoji,
    pts:   COLLECT_POINTS[emoji],
    pulse: 0,
    type:  'collect',
  };
}

// ── Reset ─────────────────────────────────────────────────────────────────────

function reset() {
  player          = makePlayer();
  hazards         = [];
  collectibles    = [];
  popups          = [];
  score           = 0;
  collectedCount  = 0;
  lives           = 3;
  level           = 1;
  speed           = 2.6;
  hazardTimer     = 0;
  hazardInterval  = 85;
  collectTimer    = 0;
  collectInterval = 140;
  invincible      = 0;
  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent     = score;
  document.getElementById('level').textContent     = level;
  document.getElementById('lives').textContent     = '❤️'.repeat(lives);
  document.getElementById('collected').textContent = collectedCount;
}

// ── Drawing ───────────────────────────────────────────────────────────────────

function drawBg() {
  ctx.fillStyle = '#0d0d2b';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1a1f40';
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.strokeStyle = '#223';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H - 16); ctx.lineTo(W, H - 16); ctx.stroke();
}

function drawCharacter(p) {
  if (invincible > 0 && Math.floor(invincible / 5) % 2 === 0) return;

  const moving = keys['ArrowLeft'] || keys['a'] || keys['A'] ||
                 keys['ArrowRight'] || keys['d'] || keys['D'];
  if (moving) p.legAnim = (p.legAnim + 0.18) % (Math.PI * 2);

  const headY  = p.y - p.h / 2 + 28;   // center of emoji head
  const bodyY  = headY + 36;
  const footY  = p.y + p.h / 2;
  const legSwing = Math.sin(p.legAnim) * (moving ? 10 : 0);

  ctx.save();

  // ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(p.x, footY + 4, 22, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // body (torso)
  const bodyColor = selectedChar.bodyColor || '#3a6fff';
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.roundRect(p.x - 14, bodyY - 2, 28, 26, 6);
  ctx.fill();

  // legs
  ctx.strokeStyle = bodyColor;
  ctx.lineWidth   = 7;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  // left leg
  ctx.moveTo(p.x - 7, bodyY + 22);
  ctx.lineTo(p.x - 7 + legSwing * 0.5,  footY);
  // right leg
  ctx.moveTo(p.x + 7, bodyY + 22);
  ctx.lineTo(p.x + 7 - legSwing * 0.5,  footY);
  ctx.stroke();

  // feet
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.ellipse(p.x - 7 + legSwing * 0.5, footY + 3, 7, 4, 0, 0, Math.PI * 2);
  ctx.ellipse(p.x + 7 - legSwing * 0.5, footY + 3, 7, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // arms
  ctx.strokeStyle = bodyColor;
  ctx.lineWidth   = 5;
  ctx.beginPath();
  ctx.moveTo(p.x - 14, bodyY + 4);
  ctx.lineTo(p.x - 22, bodyY + 14 + legSwing * 0.4);
  ctx.moveTo(p.x + 14, bodyY + 4);
  ctx.lineTo(p.x + 22, bodyY + 14 - legSwing * 0.4);
  ctx.stroke();

  // emoji head (big, centered)
  ctx.shadowColor = '#3a6fff88';
  ctx.shadowBlur  = 16;
  ctx.font        = '52px serif';
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(selectedChar.emoji, p.x, headY);
  ctx.shadowBlur  = 0;

  // name label below feet
  ctx.fillStyle   = 'rgba(255,255,255,0.75)';
  ctx.font        = 'bold 11px sans-serif';
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(selectedChar.label, p.x, footY + 10);

  ctx.restore();
}

function drawFalling(o) {
  ctx.font = `${o.w}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (o.type === 'collect') {
    // golden glow for collectibles
    const pulse = 0.5 + 0.5 * Math.sin(o.pulse);
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur  = 8 + pulse * 10;
    o.pulse += 0.12;
  } else {
    ctx.shadowColor = '#ff3030';
    ctx.shadowBlur  = 6;
  }

  ctx.fillText(o.emoji, o.x, o.y);
  ctx.shadowBlur = 0;
}

function drawPopups() {
  popups.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle   = '#ffd700';
    ctx.font        = `bold ${p.size}px sans-serif`;
    ctx.textAlign   = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  });
}

function drawScoreBg() {
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.font = 'bold 90px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(score, W / 2, H / 2 - 20);
}

// ── Collision ─────────────────────────────────────────────────────────────────

function overlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy) < ar + br;
}

// ── Update ────────────────────────────────────────────────────────────────────

function update() {
  // Move player
  let dx = 0;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += player.speed;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x + dx));

  // Spawn hazards
  if (++hazardTimer >= hazardInterval) {
    hazards.push(spawnHazard());
    hazardTimer = 0;
  }

  // Spawn collectibles
  if (++collectTimer >= collectInterval) {
    collectibles.push(spawnCollectible());
    collectTimer = 0;
  }

  const pr = player.w * 0.30;   // hitbox nur um den Körper, nicht den ganzen Kopf

  // Move & check hazards
  if (invincible > 0) invincible--;
  for (let i = hazards.length - 1; i >= 0; i--) {
    hazards[i].y += hazards[i].vy;
    if (hazards[i].y > H + 20) { hazards.splice(i, 1); score++; updateHUD(); continue; }
    if (invincible === 0 && overlap(player.x, player.y, pr, hazards[i].x, hazards[i].y, hazards[i].w * 0.42)) {
      lives--;
      invincible = 90;
      updateHUD();
      if (lives <= 0) { gameOver(); return; }
    }
  }

  // Move & check collectibles
  for (let i = collectibles.length - 1; i >= 0; i--) {
    collectibles[i].y += collectibles[i].vy;
    if (collectibles[i].y > H + 20) { collectibles.splice(i, 1); continue; }
    if (overlap(player.x, player.y, pr + 4, collectibles[i].x, collectibles[i].y, collectibles[i].w * 0.5)) {
      const pts = collectibles[i].pts;
      score += pts;
      collectedCount++;
      popups.push({ x: collectibles[i].x, y: collectibles[i].y, text: `+${pts}`, alpha: 1, size: 22 });
      collectibles.splice(i, 1);
      updateHUD();
    }
  }

  // Popups
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].y    -= 1.2;
    popups[i].alpha -= 0.022;
    if (popups[i].alpha <= 0) popups.splice(i, 1);
  }

  // Difficulty ramp
  const newLevel = 1 + Math.floor(score / 12);
  if (newLevel !== level) {
    level           = newLevel;
    speed           = 2.6 + (level - 1) * 0.45;
    hazardInterval  = Math.max(32, 85 - (level - 1) * 7);
    collectInterval = Math.max(60, 140 - (level - 1) * 8);
    updateHUD();
  }
}

function draw() {
  drawBg();
  drawScoreBg();
  collectibles.forEach(drawFalling);
  hazards.forEach(drawFalling);
  drawCharacter(player);
  drawPopups();

  // Legend bottom-left
  ctx.globalAlpha = 0.55;
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#88f';
  ctx.fillText('💣 = ausweichen   ⭐ = einsammeln', 10, H - 3);
  ctx.globalAlpha = 1;
}

function loop() {
  if (!running) return;
  update();
  draw();
  raf = requestAnimationFrame(loop);
}

// ── Game over ─────────────────────────────────────────────────────────────────

function gameOver() {
  running = false;
  cancelAnimationFrame(raf);
  document.getElementById('final-score').textContent =
    `Punkte: ${score}  |  ⭐ ${collectedCount} gesammelt`;
  document.getElementById('final-msg').textContent =
    `Level ${level} erreicht als ${selectedChar.emoji} ${selectedChar.label}!`;
  showScreen('gameover');
}

// ── Navigation ────────────────────────────────────────────────────────────────

document.getElementById('btn-to-char').addEventListener('click', () => showScreen('char'));

document.getElementById('btn-start').addEventListener('click', () => {
  showScreen(null);
  reset();
  running = true;
  raf = requestAnimationFrame(loop);
});

document.getElementById('btn-replay').addEventListener('click', () => {
  showScreen(null);
  reset();
  running = true;
  raf = requestAnimationFrame(loop);
});

document.getElementById('btn-charselect').addEventListener('click', () => showScreen('char'));

// ── Input ─────────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.key] = false; });

let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (touchStartX === null || !running) return;
  const dx = e.touches[0].clientX - touchStartX;
  if (Math.abs(dx) > 4) {
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x + dx * 0.45));
    touchStartX = e.touches[0].clientX;
  }
}, { passive: true });
</script>
</body>
</html>
